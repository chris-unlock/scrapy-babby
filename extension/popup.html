<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h3>scrapy babby</h3>

  <div class="actions">
    <label class="field-label">Capture scope
      <select id="capture-scope">
        <option value="main" selected>Main content only</option>
        <option value="full">Full page (everything)</option>
      </select>
    </label>
    <button id="btn-capture-text-images">Capture page (text + images)</button>
    <button id="btn-capture-text">Capture page (text only)</button>
    <button id="btn-capture-images">Capture page (images only)</button>
  </div>

  <div class="queue-section">
    <h4>Queue</h4>
    <div class="toggles">
      <label><input type="checkbox" id="toggle-same-origin" checked> Same-origin only (sitemap import)</label>
      <br>
      <label><input type="checkbox" id="toggle-linkedin-safe" checked> LinkedIn Safe Mode</label>
      <p id="linkedin-warning" class="warning" style="display:none;">LinkedIn mode enforces manual captures only to
        prevent ToS risk.</p>
    </div>

    <label class="field-label">Capture type for queue
      <select id="queue-mode">
        <option value="text-images" selected>Text + images</option>
        <option value="text">Text only</option>
        <option value="images">Images only</option>
      </select>
    </label>

    <button id="btn-add-queue">Add current page</button>
    <button id="btn-import-sitemap" class="secondary">Import sitemap&hellip;</button>
    <div id="sitemap-panel" class="panel" style="display:none;">
      <input type="url" id="sitemap-url" placeholder="https://example.com/sitemap.xml">
      <button id="btn-fetch-sitemap">Import</button>
    </div>
    <button id="btn-paste-links" class="secondary">Paste links&hellip;</button>
    <div id="paste-panel" class="panel" style="display:none;">
      <textarea id="paste-links-input" rows="5" placeholder="One URL per line (max 50)"></textarea>
      <button id="btn-add-links">Add to queue</button>
    </div>

    <div class="queue-actions">
      <button id="btn-run-queue">Run queue (<span id="queue-count">0</span>)</button>
      <button id="btn-cancel-queue" disabled>Cancel</button>
      <button id="btn-clear-queue" class="danger">Clear queue</button>
    </div>
    <div id="status-msg" class="status"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
